spring.application.name=doori-backend
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.datasource.url=jdbc:h2:mem:doori;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.mail.host=localhost
spring.mail.port=25

jwt.secret=doori-backend-secret-key-for-test-only-must-be-32chars
jwt.access-token-valid-ms=3600000
jwt.refresh-token-valid-ms=2592000000

# Redis 구독 초기화 비활성화: 테스트 환경에서 Redis 연결 시도 방지
# (컨텍스트 restart 시 container.start()가 등록된 리스너를 통해 Redis 연결을 시도하는 문제 회피)
chat.subscription.init.enabled=false
